# =========================
# PART 6 — HighScaleCohortPipeline
# =========================
class HighScaleCohortPipeline:

    @staticmethod
    def _safe_float(v, default):
        try: return float(v)
        except: return default

    def parse_row(self, row: dict, fallback_weight: float = 50.0) -> SyntheticBorrower:
        inc = self._safe_float(row.get("Annual_Income"), 50000.0)
        bal = self._safe_float(row.get("Loan_Balance"), 0.0)
        pay = self._safe_float(row.get("Monthly_Payment_Amount"), 0.0)
        amort = self._safe_float(row.get("Amortization_Ratio"), 100.0)
        wt = self._safe_float(row.get("Demographic_Weight"), fallback_weight)

        rec_raw = RecencyBucket.resolve(row.get("Engagement_Recency"), RecencyBucket.NEVER)
        del_raw = DelinquencyBucket.from_raw(row.get("Delinquency_Status", "CURRENT"))
        tr_raw = SaveTranche.from_raw(row.get("SAVE_Tranche", "T0"))
        bid = row.get("Borrower_ID", "UNKNOWN")

        inc_ratio = (pay * 12) / max(inc, 1.0)
        tranche_mult = 1.3 if borrower_is_save_sensitive(tr_raw) else 1.0
        r_shock = min(1.0, inc_ratio * tranche_mult * (amort / 100.0))

        base = borrower_delinquency_score(del_raw)
        emo = min(1.0, base + r_shock * 0.3)
        trust = max(0.0, 1.0 - (r_shock * 0.4) - (base * 0.5))

        conf = borrower_confusion_tolerance(rec_raw)
        retry = min(1.0, 0.3 + (emo * 0.5) + (0.2 if rec_raw is RecencyBucket.LT_30D else 0.0))
        escal = min(1.0, (1.0 - trust) * 0.8 + (emo * 0.2))
        ab = max(0.05, 1.0 - (emo * 0.6))

        prior = borrower_prior_contact_count(rec_raw)

        return SyntheticBorrower(
            borrower_id=bid,
            ach_segment=tr_raw,
            delinquency_status=del_raw,
            repayment_shock=round(r_shock, 3),
            confusion_tolerance=round(conf, 3),
            emotional_state=round(emo, 3),
            trust_state=round(trust, 3),
            retry_propensity=round(retry, 3),
            escalation_propensity=round(escal, 3),
            abandonment_threshold=round(ab, 3),
            prior_contact_count=prior,
            fraud_risk=0.0,
            demographic_weight=wt,
        )

    def stream_cohort_file(self, path: str):
        with open(path, encoding="utf-8") as f:
            for r in csv.DictReader(f): yield self.parse_row(r)

    def generate_summary(self, path: str) -> CohortSummary:
        c = w = 0.0
        s_acc = cnf_acc = esc_acc = ab_acc = 0.0
        s_sq = cnf_sq = 0.0
        mx = 0.0
        mn = 1.0
        with open(path, encoding="utf-8") as f:
            for row in csv.DictReader(f):
                b = self.parse_row(row)
                w += b.demographic_weight
                c += 1
                shk = b.repayment_shock
                cnf = b.confusion_tolerance
                s_acc += shk * b.demographic_weight
                cnf_acc += cnf * b.demographic_weight
                esc_acc += b.escalation_propensity * b.demographic_weight
                ab_acc += b.abandonment_threshold * b.demographic_weight
                s_sq += shk**2 * b.demographic_weight
                cnf_sq += cnf**2 * b.demographic_weight
                if shk > mx: mx = shk
                if cnf < mn: mn = cnf
        if w == 0: return CohortSummary()
        avg_s = s_acc / w
        avg_c = cnf_acc / w
        v_s = max(0, (s_sq / w) - (avg_s**2))
        v_c = max(0, (cnf_sq / w) - (avg_c**2))
        return CohortSummary(
            total_records=int(c),
            total_weighted_population=w,
            avg_repayment_shock=round(avg_s, 3),
            avg_confusion_tolerance=round(avg_c, 3),
            avg_escalation_propensity=round(esc_acc / w, 3),
            avg_abandonment_threshold=round(ab_acc / w, 3),
            max_repayment_shock=round(mx, 3),
            min_confusion_tolerance=round(mn, 3),
            variance_repayment_shock=round(v_s, 4),
            variance_confusion_tolerance=round(v_c, 4),
        )

# =========================
# PART 7 — PsychometricTranspositionEngine
# =========================
class PsychometricTranspositionEngine:
    def simulate_borrower_reaction(self, b: SyntheticBorrower, d: TouchpointDelta) -> SyntheticBorrower:
        c = b.confusion_tolerance
        e = b.emotional_state
        t = b.trust_state
        ci = d.clarity_index
        f = d.friction_coefficient
        if ci < 0.5:
            dv = 0.5 - ci
            c -= dv * 0.5
            e += dv * 0.3
        else:
            dv = ci - 0.5
            c += dv * 0.2
            t += dv * 0.1
        if f > 0.4:
            fv = f - 0.4
            c -= fv * 0.4
            e += fv * 0.4
        if d.channel in (TouchpointChannel.IVR, TouchpointChannel.WEB_PORTAL) and d.exposure_duration_secs > 120:
            if b.repayment_shock > 0.6:
                e += 0.1
        mc = soft_bound_sigmoid(c)
        me = soft_bound_sigmoid(e)
        mt = soft_bound_sigmoid(t)
        retry = soft_bound_sigmoid(b.retry_propensity + (1.0 - mc) * 0.2)
        escal = soft_bound_sigmoid((1.0 - mt) * 0.7 + (me * 0.3))
        abandon = soft_bound_sigmoid(b.abandonment_threshold - (me * 0.2))
        return SyntheticBorrower(
            borrower_id=b.borrower_id,
            ach_segment=b.ach_segment,
            delinquency_status=b.delinquency_status,
            repayment_shock=b.repayment_shock,
            confusion_tolerance=round(mc, 3),
            emotional_state=round(me, 3),
            trust_state=round(mt, 3),
            retry_propensity=round(retry, 3),
            escalation_propensity=round(escal, 3),
            abandonment_threshold=round(abandon, 3),
            prior_contact_count=b.prior_contact_count,
            fraud_risk=b.fraud_risk,
            demographic_weight=b.demographic_weight,
        )

# =========================
# PART 8 — PredictiveReactionSandbox
# =========================
class PredictiveReactionSandbox:
    def generate_projected_metrics(self, base: Metrics, summ: CohortSummary, d: TouchpointDelta) -> Metrics:
        add = d.exposure_duration_secs
        if d.friction_coefficient > 0.5:
            add += d.friction_coefficient * 40
        aht = base.aht + add
        abandon_mult = 1.0 + (1.0 - summ.avg_abandonment_threshold) * 0.5
        unclipped_abandon = base.abandon_rate * abandon_mult * (1.0 + d.friction_coefficient * 0.3)
        unclipped_reentry = (1.0 - summ.avg_confusion_tolerance) * 0.40
        unclipped_callback = base.callback_rate * (1.1 if unclipped_abandon > 0.15 else 1.0)
        p_abandon = soft_bound_sigmoid(unclipped_abandon)
        p_reentry = soft_bound_sigmoid(unclipped_reentry)
        p_repeat_auth = soft_bound_sigmoid((1.0 - summ.avg_confusion_tolerance) * 0.25)
        p_transfer = soft_bound_sigmoid(summ.avg_escalation_propensity * 0.85)
        p_containment = max(0.0, 1.0 - p_transfer - p_abandon)
        if d.randomize_verification:
            d_idx = max(0.01, base.determinism_index - 0.40)
        else:
            d_idx = base.determinism_index
        return Metrics(
            containment=round(p_containment, 3),
            aht=round(aht, 1),
            callback_rate=round(soft_bound_sigmoid(unclipped_callback), 3),
            abandon_rate=round(p_abandon, 3),
            backoffice_trigger=round(soft_bound_sigmoid(base.backoffice_trigger + (p_reentry * 0.15)), 3),
            determinism_index=round(d_idx, 3),
            repeat_auth_rate=round(p_repeat_auth, 3),
            ivr_reentry_rate=round(p_reentry, 3),
            transfer_rate=round(p_transfer, 3),
            short_disconnect_rate=round(base.short_disconnect_rate * abandon_mult, 3),
            queue_depth=base.queue_depth,
            unclipped_abandon_rate=round(unclipped_abandon, 4),
            unclipped_callback_rate=round(unclipped_callback, 4),
            unclipped_ivr_reentry_rate=round(unclipped_reentry, 4),
        )

# =========================
# PART 9 — LyapunovStabilityVerifier
# =========================
class LyapunovStabilityVerifier:
    @staticmethod
    def compute_energy_state(b: Metrics, c: Metrics) -> float:
        da = c.abandon_rate - b.abandon_rate
        dr = c.ivr_reentry_rate - b.ivr_reentry_rate
        dt = c.transfer_rate - b.transfer_rate
        dn = (c.aht - b.aht) / max(b.aht, 1)
        return round(
            LYAPUNOV_ENERGY_WEIGHTS["abandon_rate"] * (da**2) +
            LYAPUNOV_ENERGY_WEIGHTS["ivr_reentry_rate"] * (dr**2) +
            LYAPUNOV_ENERGY_WEIGHTS["transfer_rate"] * (dt**2) +
            LYAPUNOV_ENERGY_WEIGHTS["normalized_aht"] * (dn**2),
            5,
        )

# =========================
# PART 10 — RegimeDetector
# =========================
class RegimeDetector:
    def detect(self, m: Metrics, t: Optional[TemporalWindow], prev: Optional[SystemRegime]):
        sc = {r: 0.0 for r in SystemRegime}
        sc[SystemRegime.SURGE] += m.callback_rate * 1.5 + m.queue_depth * 0.5
        sc[SystemRegime.CONFUSION] += m.ivr_reentry_rate * 2.0 + m.transfer_rate * 1.5 + m.repeat_auth_rate
        sc[SystemRegime.PANIC] += m.abandon_rate * 2.5 + m.short_disconnect_rate * 2.0 + m.callback_rate
        sc[SystemRegime.SATURATED] += m.queue_depth * 2.5 + m.backoffice_trigger * 1.5
        sc[SystemRegime.FRAUD_WAVE] += m.determinism_index * 2.0
        if t:
            cv = t.rolling_velocity("unclipped_callback_rate") or t.rolling_velocity("callback_rate")
            av = t.rolling_velocity("unclipped_abandon_rate") or t.rolling_velocity("abandon_rate")
            if cv > 0:
                sc[SystemRegime.SURGE] += min(VELOCITY_MAX_BOUND, cv * 2.0)
            if av > 0:
                sc[SystemRegime.PANIC] += min(VELOCITY_MAX_BOUND, av * 3.0)
        mx = max(sc.values())
        if mx <= 0:
            dom = SystemRegime.STABLE
            conf = 1.0
            norm = {r: 0.0 for r in SystemRegime}
        else:
            norm = {r: round(v / mx, 3) for r, v in sc.items()}
            dom = max(norm, key=norm.get)
            conf = norm[dom]
        if prev:
            ps = norm.get(prev, 0)
            ds = norm.get(dom, 0)
            if dom != prev and ds - ps < HYSTERESIS_MARGIN:
                dom = prev
                conf = ps
        return RegimeProfile(scores=norm, dominant_regime=dom, confidence=round(conf, 3))

# =========================
# PART 11 — SentinelIVR Main Engine
# =========================
class SentinelIVR:
    def __init__(self, ctx: SentinelRunContext, temp: Optional[TemporalWindow] = None):
        self.context = ctx
        self.temporal_window = temp
        self.detector = RegimeDetector()
        self.transposer = PsychometricTranspositionEngine()
        self.sandbox = PredictiveReactionSandbox()
        self.lyap = LyapunovStabilityVerifier()

    def simulate_high_scale_update(self, pop: PopulationType, base: Metrics, cohort, delta: TouchpointDelta) -> PopulationResult:
        c = w = 0.0
        s_a = c_a = e_a = a_a = sq = csq = 0.0
        mx = 0.0
        mn = 1.0
        for b in cohort:
            m = self.transposer.simulate_borrower_reaction(b, delta)
            w += m.demographic_weight
            c += 1
            shk = m.repayment_shock
            cnf = m.confusion_tolerance
            s_a += shk * m.demographic_weight
            c_a += cnf * m.demographic_weight
            e_a += m.escalation_propensity * m.demographic_weight
            a_a += m.abandonment_threshold * m.demographic_weight
            sq += shk**2 * m.demographic_weight
            csq += cnf**2 * m.demographic_weight
            if shk > mx: mx = shk
            if cnf < mn: mn = cnf
        if w == 0: w = 1
        avg_s = s_a / w
        avg_c = c_a / w
        v_s = max(0, (sq / w) - (avg_s**2))
        v_c = max(0, (csq / w) - (avg_c**2))
        summ = CohortSummary(c, w, avg_s, avg_c, e_a / w, a_a / w, mx, mn, v_s, v_c)
        post = self.sandbox.generate_projected_metrics(base, summ, delta)
        return self.evaluate(pop, base, post, summ)

    def evaluate(self, pop: PopulationType, b: Metrics, p: Metrics, s: CohortSummary = None) -> PopulationResult:
        prof = self.detector.detect(p, self.temporal_window, self.context.last_regime)
        self.context.last_regime = prof.dominant_regime
        if pop is PopulationType.FRAUD:
            return self._eval_fraud(b, p, prof)
        if not self.context.learningAllowed():
            return PopulationResult(pop, SentinelResult.NEUTRAL, "learning suspended", prof.dominant_regime, prof.confidence, {k.value: v for k, v in prof.scores.items()}, self.context.run_id, self.context.timestamp)
        return self._eval_borrower(pop, b, p, prof, s)

    def _eval_borrower(self, pop, b, p, prof, s):
        max_e = 0.35
        if s:
            mv = max(s.variance_repayment_shock, s.variance_confusion_tolerance)
            max_e = max(0.10, 0.35 - (mv * 2))
        dv = self.lyap.compute_energy_state(b, p)
        if dv > max_e:
            return PopulationResult(pop, SentinelResult.ENERGY_UNSTABLE, f"Lyapunov violation dv={dv} > {max_e}", prof.dominant_regime, prof.confidence, {k.value: v for k, v in prof.scores.items()}, self.context.run_id, self.context.timestamp, dv)
        reg = prof.dominant_regime
        tol = regime_tolerances(reg)
        if p.determinism_index > b.determinism_index or p.unclipped_ivr_reentry_rate > b.unclipped_ivr_reentry_rate * 1.25 or p.unclipped_abandon_rate > b.unclipped_abandon_rate * 1.30:
            tol = regime_tolerances(SystemRegime.FRAUD_WAVE)
        scale_mult = 1.0
        thresh_mult = 1.0
        if s:
            mv = max(s.variance_repayment_shock, s.variance_confusion_tolerance)
            w = 1 / (1 + exp(-40 * (mv - 0.05)))
            mids = (s.avg_repayment_shock + s.max_repayment_shock) / 2
            bs = (1 - w) * mids + w * s.max_repayment_shock
            midt = (s.avg_confusion_tolerance + s.min_confusion_tolerance) / 2
            bt = (1 - w) * midt + w * s.min_confusion_tolerance
            scale_mult += bs * 0.5
            thresh_mult = max(0.5, bt)
        pr = regime_priority_list(reg)
        ck = {
            "operationalefficiency": ((p.aht - b.aht) <= tol.max_aht_delta * scale_mult and p.callback_rate <= b.callback_rate + tol.max_callback_delta),
            "futureselfresolution": (p.backoffice_trigger <= b.backoffice_trigger + BACKOFFICE_REGRESSION_THRESHOLD),
            "informationaccuracy": (p.abandon_rate <= b.abandon_rate + (tol.max_abandon_delta * thresh_mult)),
            "borrowerpsychologicalsafety": (p.containment >= b.containment + (tol.min_containment_delta / thresh_mult)),
            "queuepreservation": (p.queue_depth < tol.max_queue_depth),
            "determinismreduction": (p.determinism_index <= b.determinism_index),
        }
        fails = [x for x in pr if not ck.get(x, True)]
        res = SentinelResult.REGRESSIVE if fails else SentinelResult.NEUTRAL
        rat = "failed: " + ", ".join(fails) if fails else "no regression"
        return PopulationResult(pop, res, rat, prof.dominant_regime, prof.confidence, {k.value: v for k, v in prof.scores.items()}, self.context.run_id, self.context.timestamp, dv)

    def _eval_fraud(self, b, p, prof):
        d = p.determinism_index - b.determinism_index
        res = SentinelResult.RISK_INCREASING if d > FRAUD_DETERMINISM_THRESHOLD else SentinelResult.NEUTRAL
        rat = f"determinism +{round(d, 3)}" if res is SentinelResult.RISK_INCREASING else "no fraud increase"
        return PopulationResult(PopulationType.FRAUD, res, rat, prof.dominant_regime, prof.confidence, {k.value: v for k, v in prof.scores.items()}, self.context.run_id, self.context.timestamp)

