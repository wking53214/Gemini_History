# -------------------------
# ExpansionMixin
# -------------------------
class ExpansionMixin:
    _ALIASES: Dict[str, "ExpansionMixin"] = {}
    def __str__(self): return self.value
    @classmethod
    def from_raw(cls, raw: str):
        raw_norm = (raw or "").strip().upper()
        for m in cls:
            if m.value.upper() == raw_norm:
                return m
        if raw_norm in cls._ALIASES:
            return cls._ALIASES[raw_norm]
        raise KeyError(f"{cls.__name__}.from_raw(): {raw}")

# -------------------------
# PopulationType
# -------------------------
class PopulationType(ExpansionMixin, Enum):
    NORMAL = "normal"
    SAVE = "save"
    FRAUD = "fraud"
    _ALIASES = {"STANDARD": NORMAL, "DEFAULT": NORMAL}

# -------------------------
# SentinelResult
# -------------------------
class SentinelResult(ExpansionMixin, Enum):
    NEUTRAL = "NEUTRAL"
    REGRESSIVE = "REGRESSIVE"
    RISK_INCREASING = "RISKINCREASING"
    ENERGY_UNSTABLE = "ENERGY_UNSTABLE"

# -------------------------
# SystemRegime
# -------------------------
class SystemRegime(ExpansionMixin, Enum):
    STABLE = "stable"
    SURGE = "surge"
    CONFUSION = "confusion"
    PANIC = "panic"
    SATURATED = "saturated"
    FRAUD_WAVE = "fraud_wave"
    UNKNOWN = "unknown"
    def is_fraud_like(self) -> bool:
        return self is SystemRegime.FRAUD_WAVE

# -------------------------
# TouchpointChannel
# -------------------------
class TouchpointChannel(ExpansionMixin, Enum):
    IVR = "ivr"
    EMAIL = "email"
    WEB_PORTAL = "web_portal"
    LETTER = "direct_mail"
    SMS = "sms"

# -------------------------
# RecencyBucket
# -------------------------
class RecencyBucket(ExpansionMixin, Enum):
    LT_30D = "<30D"
    ONE_TO_12MO = "1-12MO"
    GT_1YR = ">1YR"
    NEVER = "NEVER"
    _ALIASES = {"<30": LT_30D, "LESS_THAN_30": LT_30D, "NEVERENGAGED": NEVER}
    @classmethod
    def resolve(cls, raw: str, default=None):
        try:
            return cls.from_raw(raw)
        except:
            return default if default is not None else cls.NEVER

# -------------------------
# DelinquencyBucket
# -------------------------
class DelinquencyBucket(ExpansionMixin, Enum):
    CURRENT = "CURRENT"
    ONE_TO_29 = "1-29"
    THIRTY_TO_59 = "30-59"
    SIXTY_TO_89 = "60-89"
    NINETY_PLUS = "90+"

# -------------------------
# SaveTranche
# -------------------------
class SaveTranche(ExpansionMixin, Enum):
    T0 = "T0"
    T1 = "T1"
    T2 = "T2"
    T3 = "T3"

# =========================
# PART 2 — Borrower Maps
# =========================
DELINQUENCY_SCORES = MappingProxyType({
    DelinquencyBucket.CURRENT: 0.1,
    DelinquencyBucket.ONE_TO_29: 0.3,
    DelinquencyBucket.THIRTY_TO_59: 0.5,
    DelinquencyBucket.SIXTY_TO_89: 0.7,
    DelinquencyBucket.NINETY_PLUS: 0.9,
})

RECENCY_CONFUSION_SCORES = MappingProxyType({
    RecencyBucket.LT_30D: 0.8,
    RecencyBucket.ONE_TO_12MO: 0.6,
    RecencyBucket.GT_1YR: 0.4,
    RecencyBucket.NEVER: 0.2,
})

RECENCY_PRIOR_CONTACTS = MappingProxyType({
    RecencyBucket.LT_30D: 3,
    RecencyBucket.ONE_TO_12MO: 1,
    RecencyBucket.GT_1YR: 2,
    RecencyBucket.NEVER: 0,
})

SAVE_SENSITIVE_TRANCHES = frozenset({SaveTranche.T1, SaveTranche.T2, SaveTranche.T3})

# Mapping functions
def borrower_delinquency_score(bucket): return DELINQUENCY_SCORES[bucket]
def borrower_confusion_tolerance(bucket): return RECENCY_CONFUSION_SCORES[bucket]
def borrower_prior_contact_count(bucket): return RECENCY_PRIOR_CONTACTS[bucket]
def borrower_is_save_sensitive(tr): return tr in SAVE_SENSITIVE_TRANCHES

def safe_delinquency_score(bucket, default=DelinquencyBucket.CURRENT):
    return DELINQUENCY_SCORES.get(bucket, DELINQUENCY_SCORES[default])

def safe_confusion_tolerance(bucket, default=RecencyBucket.NEVER):
    return RECENCY_CONFUSION_SCORES.get(bucket, RECENCY_CONFUSION_SCORES[default])

# Validator
def validate_borrower_maps():
    for d in DelinquencyBucket:
        assert d in DELINQUENCY_SCORES
    for r in RecencyBucket:
        assert r in RECENCY_CONFUSION_SCORES
        assert r in RECENCY_PRIOR_CONTACTS
    for t in SaveTranche:
        if t is SaveTranche.T0: continue
        assert t in SAVE_SENSITIVE_TRANCHES

