LYAPUNOV_ENERGY_WEIGHTS = {
    "abandon_rate": 1.0,
    "ivr_reentry_rate": 0.8,
    "transfer_rate": 1.2,
    "normalized_aht": 0.5,
}

FRAUD_DETERMINISM_THRESHOLD = 0.08
BACKOFFICE_REGRESSION_THRESHOLD = 0.015
VELOCITY_MAX_BOUND = 0.25
HYSTERESIS_MARGIN = 0.12

LEARNING_EXCLUSIONS = frozenset({
    "OUTAGE",
    "MAJOR_INCIDENT",
    "INVALID_METRIC_STREAM",
})

# Utilities
def soft_bound_sigmoid(x: float) -> float:
    try: return 1 / (1 + exp(-x))
    except OverflowError: return 1.0 if x > 0 else 0.0

def clamp(x: float, lo: float, hi: float) -> float:
    if x < lo: return lo
    if x > hi: return hi
    return x

def safe_ratio(num: float, den: float, default=0.0) -> float:
    if den == 0: return default
    return num / den

