@dataclass
class TemporalWindow:
    recent_metrics: List[Metrics] = field(default_factory=list)
    def rolling_mean(self, attr: str) -> float:
        if not self.recent_metrics: return 0.0
        vals = [getattr(m, attr) for m in self.recent_metrics]
        return sum(vals) / len(vals)
    def rolling_velocity(self, attr: str) -> float:
        if len(self.recent_metrics) < 2: return 0.0
        return getattr(self.recent_metrics[-1], attr) - getattr(self.recent_metrics[-2], attr)

@dataclass
class SentinelRunContext:
    run_id: str
    timestamp: datetime
    contaminated_conditions: Optional[List[str]] = None
    last_regime: Optional[SystemRegime] = None

    def learningAllowed(self) -> bool:
        if not self.contaminated_conditions: return True
        return not any(c in LEARNING_EXCLUSIONS for c in self.contaminated_conditions)

